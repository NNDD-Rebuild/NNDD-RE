name: update-sidecar-pin

# 毎週月曜 日本時間 6:00 (日曜 21:00 UTC) に、Tailscale サイドカー (nndd-re-tailscale) の新しいリリースを確認する。
# ピンと違うリリースがあれば、バイナリを取得して自前でハッシュを計算し (scripts/update-sidecar-pin.mjs)、
# 型チェック・IPC チェックが通ったら PR を作る。ピンは利用者の PC で実行されるバイナリを決めるため、マージは人が行う。
on:
  schedule:
    - cron: '0 21 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: find latest sidecar release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # リリースは prerelease なので releases/latest は使えない (一覧の先頭を取る)
          latest=$(gh release list --repo NNDD-Rebuild/nndd-re-tailscale --limit 1 --json tagName --jq '.[0].tagName // ""')
          current=$(sed -n "s/^  version: '\(.*\)',$/\1/p" src/main/server/tailscale/sidecarPin.ts | head -n1)
          echo "latest=${latest} current=${current}"
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          if [ -z "${latest}" ] || [ "${latest}" = "${current}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "current=${current}" >> "$GITHUB_OUTPUT"
          fi
      - name: update pin
        if: steps.latest.outputs.changed == 'true'
        run: |
          npm ci --ignore-scripts
          node scripts/update-sidecar-pin.mjs "${{ steps.latest.outputs.latest }}"
          npm run tc:all
          npm run check:ipc
      - name: open pull request
        if: steps.latest.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.latest.outputs.latest }}
          CURRENT: ${{ steps.latest.outputs.current }}
        run: |
          branch="chore/update-sidecar-${LATEST}"
          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            echo "ブランチ ${branch} は既にあります。PR 作成済みとして終了します"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "${branch}"
          git add src/main/server/tailscale/sidecarPin.ts
          git commit -m "chore: Tailscale サイドカーのピンを ${LATEST} に更新する"
          git push origin "${branch}"
          gh pr create --base main --head "${branch}" \
            --title "chore: Tailscale サイドカーのピンを ${LATEST} に更新する" \
            --body "Tailscale サイドカー ${CURRENT:-未設定} → ${LATEST}

          自動作成。リリースの各バイナリを取得し、自前で SHA256 を計算して SHA256SUMS と一致することを確認したうえで \`sidecarPin.ts\` を更新しています。型チェックと IPC チェックは通っています。

          **このピンは、利用者の PC で実行されるバイナリを決めます。** マージ前に、次を確認してください。
          - 差分が \`sidecarPin.ts\` のバージョンと 4 つのハッシュだけであること
          - [リリース](https://github.com/NNDD-Rebuild/nndd-re-tailscale/releases/tag/${LATEST}) の変更内容 (tailscale.com の更新 PR) に不審な点が無いこと
          - 可能なら実機で、取得 → ログイン → 再生 → ログアウトを確認すること

          マージ後は、NNDD-RE の新バージョンのリリースで利用者に届きます。"
