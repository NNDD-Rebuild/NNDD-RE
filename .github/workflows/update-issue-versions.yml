name: update-issue-versions

# リリースを公開 / 削除したときに、不具合報告テンプレートのバージョン選択肢を直近のリリースに更新する。
# issue フォームの dropdown は静的 YAML しか書けないため、選択肢をここで書き換えて main にコミットする。
on:
  release:
    types:
      - published
      - deleted
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: update dropdown
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release list --limit 30 --json tagName,isDraft | node scripts/update-issue-versions.mjs
      - name: commit
        run: |
          if git diff --quiet; then
            echo "変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: 不具合報告テンプレートのバージョン選択肢を更新する"
          git push origin main
