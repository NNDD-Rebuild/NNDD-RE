<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <!--
      ニコ生ゲーム (akashic) の実行ホスト。AkashicLayer が sandbox 付き iframe として読み込む。
      親のウィンドウとは別の文書なので、親の CSP を引き継がない。ゲームのコードは公式の配信元からだけ読み込む。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-eval' https://resource.akashic.coe.nicovideo.jp; connect-src https://resource.akashic.coe.nicovideo.jp; img-src https: data: blob:; media-src https: data: blob:; style-src 'unsafe-inline';"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      #akashic-gameview {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div id="akashic-gameview"></div>
    <script src="./akashic-host.js"></script>
  </body>
</html>
